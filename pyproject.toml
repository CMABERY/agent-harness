[project]
name = "agent"
version = "0.1.0"
description = "An autonomous coding-agent harness (standard library only)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent = "agent.cli:main"

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-data]
agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
required-version = "==0.13.5"
